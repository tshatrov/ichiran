name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl postgresql-client

      - name: Start PostgreSQL container
        env:
          ICHIRAN_DB_URL: https://github.com/tshatrov/ichiran/releases/download/ichiran-260118/ichiran-260118.pgdump
        run: |
          # Build the postgres image
          docker build -t ichiran-pg -f docker/postgres-dockerfile --build-arg ICHIRAN_DB_URL=$ICHIRAN_DB_URL .

          # Start the container with:
          # - Trust authentication for host connections (allows external connections without password)
          # - Port 5432 published to all host interfaces
          # - PGDATA set to match docker-compose
          docker run -d --name pg --shm-size=1gb \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_USER=postgres \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            ichiran-pg

      - name: Wait for PostgreSQL initialization
        run: |
          # Wait for PostgreSQL to be ready inside the container
          echo "Waiting for PostgreSQL to start..."
          timeout 300 bash -c 'while ! docker exec pg pg_isready -U postgres; do sleep 1; done'

          # Wait for the jmdict database to be created and populated
          echo "Waiting for jmdict database..."
          timeout 600 bash -c 'while ! docker exec pg psql -U postgres -l 2>/dev/null | grep -q jmdict; do sleep 1; done'

          echo "Waiting for restore to complete..."
          sleep 10

          # Verify external connectivity from the runner
          echo "Checking external connection..."
          timeout 60 bash -c 'while ! pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          echo "PostgreSQL is ready and accessible from host!"

          # Test actual connection
          psql -h localhost -p 5432 -U postgres -d jmdict -c "SELECT 1"

      - name: Set up Quicklisp
        run: |
          wget https://beta.quicklisp.org/quicklisp.lisp
          sbcl --load quicklisp.lisp --non-interactive \
               --eval "(quicklisp-quickstart:install)" \
               --eval "(ql-util:without-prompting (ql:add-to-init-file))" \
               --eval "(sb-ext:quit)"

      - name: Clone jmdictdb dependency
        run: |
          git clone https://gitlab.com/yamagoya/jmdictdb.git

      - name: Copy CI settings
        run: |
          cp settings.lisp.ci settings.lisp

      - name: Build ichiran core
        run: |
          # Load ichiran first
          sbcl --non-interactive \
               --eval "(push '*default-pathname-defaults* asdf:*central-registry*)" \
               --eval "(ql:quickload :ichiran)"

          # Build the core file with caches initialized
          sbcl --non-interactive \
               --eval "(push '*default-pathname-defaults* asdf:*central-registry*)" \
               --eval "(ql:quickload :ichiran)" \
               --eval "(ichiran/mnt:add-errata)" \
               --eval "(in-package :ichiran/all)" \
               --eval "(init-all-caches t)" \
               --eval "(init-suffixes t)" \
               --eval "(postmodern:clear-connection-pool)" \
               --eval "(uiop:dump-image \"/tmp/ichiran.core\" :executable nil :compression t)" \
               --eval "(sb-ext:quit)"

      - name: Run tests
        run: |
          sbcl --core /tmp/ichiran.core --non-interactive \
               --eval "(ichiran/test:run-all-tests)" \
               --eval "(sb-ext:quit)"
